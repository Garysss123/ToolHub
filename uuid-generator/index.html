<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID / GUID 批量產生器 | ToolHub - 密碼學安全級隨機標識生成</title>
    <meta name="description" content="免費且極速的線上 UUID (v4) 批量生成工具。支援自訂大小寫、移除連字號、一鍵複製與匯出。呼叫瀏覽器底層 Web Crypto API，保障密碼學級別的絕對唯一性與隱私安全。">
    
    <!-- 系統核心依賴 (無廣告純淨版) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        // 融合系統核心色系
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hub: {
                            900: '#0B1120',
                            800: '#151F32',
                            700: '#1E293B',
                            accent: '#38BDF8',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B1120;
            color: #E2E8F0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; border: 2px solid #0B1120; }
        ::-webkit-scrollbar-thumb:hover { background: #38BDF8; }

        /* Range Slider 美化 */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: #38BDF8; cursor: pointer; margin-top: -7px;
            box-shadow: 0 0 10px rgba(56,189,248,0.5); transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:active { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #1E293B; border-radius: 2px;
        }

        /* 編輯器專屬樣式 */
        .output-textarea {
            width: 100%;
            height: 100%;
            min-height: 350px;
            background-color: #0f172a;
            color: #e2e8f0;
            border: none;
            resize: vertical;
            padding: 1.5rem;
            outline: none;
            line-height: 1.8;
            font-size: 0.9rem;
        }
        .output-textarea::placeholder { color: #475569; }
        
        /* 視覺反饋動畫 */
        @keyframes flash-success {
            0% { background-color: rgba(56, 189, 248, 0.2); }
            100% { background-color: transparent; }
        }
        .flash-active { animation: flash-success 0.5s ease-out; }

        /* 切換開關美化 */
        .toggle-checkbox:checked { right: 0; border-color: #38BDF8; }
        .toggle-checkbox:checked + .toggle-label { background-color: #38BDF8; }
        .toggle-checkbox:checked + .toggle-label:after { transform: translateX(100%); border-color: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen relative font-sans">

    <!-- 1. 系統組件：Header -->
    <div id="component-header"></div>
    <!-- 2. 系統組件：Sidebar -->
    <div id="component-sidebar"></div>

    <!-- 3. 核心模塊：UUID Generator -->
    <main class="relative z-10 flex-grow w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 animate-[fadeIn_0.5s_ease-out]">
        
        <!-- 模塊標題區 -->
        <div class="text-center space-y-4 mb-8 mt-2">
            <div class="inline-flex items-center justify-center p-2 mb-1 rounded-full bg-hub-800 border border-hub-700 text-xs text-hub-accent">
                <span class="flex w-2 h-2 bg-hub-accent rounded-full animate-pulse mr-2"></span>
                Web Crypto API 密碼學亂數矩陣已就緒
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white">
                UUID / GUID <span class="text-transparent bg-clip-text bg-gradient-to-r from-hub-accent to-fuchsia-500">批量生成器</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed">
                基於瀏覽器底層硬體加速的高精度標識產生器 (v4 標準)。支援高通量批量鑄造與多維度格式轉換，確保資料庫主鍵的絕對唯一性。
            </p>
        </div>

        <!-- 運算主控台 -->
        <div class="bg-hub-800/80 backdrop-blur-sm border border-hub-700 rounded-2xl shadow-2xl shadow-black/50 overflow-hidden flex flex-col lg:flex-row min-h-[500px]">
            
            <!-- 左側：控制面板 (Control Panel) -->
            <div class="w-full lg:w-1/3 bg-hub-900/50 border-r border-hub-700 p-6 flex flex-col gap-8 relative">
                
                <!-- 數量控制 -->
                <div class="space-y-4">
                    <div class="flex justify-between items-end border-b border-hub-700 pb-2">
                        <label class="text-sm font-bold text-white flex items-center gap-2">
                            <i class="ph ph-hash text-hub-accent text-lg"></i> 生成數量
                        </label>
                        <input type="number" id="input-quantity" value="1" min="1" max="5000" class="w-20 bg-hub-800 border border-hub-700 rounded-md px-2 py-1 text-white font-mono text-sm text-center focus:border-hub-accent outline-none">
                    </div>
                    <input type="range" id="slider-quantity" min="1" max="5000" value="1" class="w-full">
                    <div class="flex justify-between text-xs text-slate-500 font-mono">
                        <span>1</span>
                        <span>5,000 max</span>
                    </div>
                </div>

                <!-- 格式控制 -->
                <div class="space-y-5">
                    <h3 class="text-sm font-bold text-white flex items-center gap-2 border-b border-hub-700 pb-2">
                        <i class="ph ph-faders-horizontal text-hub-accent text-lg"></i> 輸出格式
                    </h3>
                    
                    <!-- Toggle 1: 包含連字號 -->
                    <label class="flex items-center justify-between cursor-pointer group">
                        <div class="flex flex-col">
                            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">包含連字號 (Hyphens)</span>
                            <span class="text-[10px] text-slate-500 font-mono mt-0.5">8-4-4-4-12 格式</span>
                        </div>
                        <div class="relative">
                            <input type="checkbox" id="toggle-hyphens" class="sr-only" checked>
                            <div class="block bg-hub-800 border border-hub-700 w-10 h-6 rounded-full transition-colors toggle-bg"></div>
                            <div class="dot absolute left-1 top-1 bg-slate-400 w-4 h-4 rounded-full transition-transform"></div>
                        </div>
                    </label>

                    <!-- Toggle 2: 全大寫 -->
                    <label class="flex items-center justify-between cursor-pointer group">
                        <div class="flex flex-col">
                            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">轉換為大寫 (Uppercase)</span>
                            <span class="text-[10px] text-slate-500 font-mono mt-0.5">A-F 替換 a-f</span>
                        </div>
                        <div class="relative">
                            <input type="checkbox" id="toggle-uppercase" class="sr-only">
                            <div class="block bg-hub-800 border border-hub-700 w-10 h-6 rounded-full transition-colors toggle-bg"></div>
                            <div class="dot absolute left-1 top-1 bg-slate-400 w-4 h-4 rounded-full transition-transform"></div>
                        </div>
                    </label>
                </div>

                <!-- 產生按鈕 -->
                <div class="mt-auto pt-6 border-t border-hub-700">
                    <button id="btn-generate" class="w-full py-4 rounded-xl bg-gradient-to-r from-hub-accent to-blue-600 hover:from-[#1da7e0] hover:to-blue-500 text-white font-bold text-base flex items-center justify-center gap-2 transition-all shadow-lg shadow-blue-900/30 active:scale-[0.98]">
                        <i class="ph ph-lightning text-xl"></i> 立即鑄造 UUID
                    </button>
                </div>
            </div>

            <!-- 右側：輸出區域 (Output Area) -->
            <div class="w-full lg:w-2/3 flex flex-col relative group">
                
                <!-- 頂部工具列 -->
                <div class="bg-hub-900 px-4 py-3 border-b border-hub-700 flex justify-between items-center z-10">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-hub-accent uppercase tracking-widest">Output Hub</span>
                        <span id="output-count" class="px-2 py-0.5 bg-hub-800 rounded text-[10px] font-mono text-slate-400">0 generated</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btn-copy" class="px-3 py-1.5 bg-hub-800 hover:bg-hub-700 border border-hub-700 rounded-lg text-slate-300 text-xs font-medium transition-colors flex items-center gap-1.5 shadow-sm">
                            <i class="ph ph-copy"></i> Copy All
                        </button>
                        <button id="btn-download" class="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/50 text-emerald-400 text-xs font-medium rounded-lg transition-colors flex items-center gap-1.5 shadow-sm">
                            <i class="ph ph-download-simple"></i> Save .txt
                        </button>
                    </div>
                </div>

                <!-- 文字框 -->
                <div id="editor-wrapper" class="flex-grow relative">
                    <textarea id="output-textarea" class="output-textarea font-mono" readonly placeholder="點擊左側「立即鑄造」按鈕生成 UUID..."></textarea>
                </div>
            </div>
            
        </div>
    </main>

    <!-- 全域 Toast 提示 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white border border-slate-700 px-6 py-3 rounded-full font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-[100] flex items-center gap-2 translate-y-4">
        <i class="ph-fill ph-check-circle text-lg text-hub-accent" id="toast-icon"></i> 
        <span id="toast-msg">操作成功</span>
    </div>

    <!-- 4. 動態載入：頁尾 (Footer) -->
    <!-- ⚠️ 純淨架構：不帶實體廣告腳本，統一由系統中樞水合 -->
    <div id="component-footer"></div>

    <!-- ========================================== -->
    <!-- 系統級中樞神經：負責組件載入與事件代理        -->
    <!-- ========================================== -->
    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                const container = document.getElementById(elementId);
                container.innerHTML = html;

                Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                console.error(`[System Error] 模組 ${filePath} 載入失敗:`, error);
            }
        }

        function setupEventDelegation() {
            document.body.addEventListener('click', (e) => {
                const triggerBtn = e.target.closest('#sidebar-trigger-btn');
                const closeBtn = e.target.closest('#sidebar-close-btn');
                const overlayLayer = e.target.closest('#sidebar-overlay');

                if (triggerBtn || closeBtn || overlayLayer) {
                    const container = document.getElementById('sidebar-container');
                    const overlay = document.getElementById('sidebar-overlay');
                    if (container && overlay) {
                        const isClosed = container.classList.contains('translate-x-full');
                        if (isClosed && triggerBtn) {
                            overlay.classList.remove('pointer-events-none');
                            requestAnimationFrame(() => {
                                container.classList.remove('translate-x-full');
                                overlay.classList.remove('opacity-0');
                                overlay.classList.add('opacity-100');
                            });
                        } else if (!isClosed && (closeBtn || overlayLayer || triggerBtn)) {
                            container.classList.add('translate-x-full');
                            overlay.classList.remove('opacity-100');
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.classList.add('pointer-events-none'), 300);
                        }
                    }
                }
            });
        }

        function setupSidebarActiveState() {
            const currentPath = '/uuid-generator';
            document.querySelectorAll('#sidebar-container .nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (!href) return;
                const itemPath = href.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
                if (currentPath === itemPath || (currentPath !== '/' && itemPath !== '/' && currentPath.startsWith(itemPath))) {
                    item.classList.remove('text-slate-400', 'border-transparent', 'hover:bg-slate-800/50');
                    item.classList.add('text-[#3ebcf0]', 'border-[#3ebcf0]', 'bg-slate-800/70', 'shadow-[inset_0_0_10px_rgba(62,188,240,0.05)]');
                    const icon = item.querySelector('svg');
                    if (icon) icon.classList.add('text-[#3ebcf0]');
                }
            });
        }

        async function initializeSystem() {
            await Promise.all([
                loadComponent('component-header', '/components/header.html'),
                loadComponent('component-sidebar', '/components/sidebar.html'),
                loadComponent('component-footer', '/components/footer.html')
            ]);
            
            if (typeof lucide !== 'undefined') lucide.createIcons();
            setupEventDelegation();
            setupSidebarActiveState();
        }

        document.addEventListener('DOMContentLoaded', initializeSystem);
    </script>

    <!-- ========================================== -->
    <!-- 工具級業務邏輯：UUID 密碼學矩陣               -->
    <!-- ========================================== -->
    <style>
        /* CSS for Custom Toggles */
        input[type="checkbox"]:checked ~ .toggle-bg { background-color: #38BDF8; border-color: #38BDF8; }
        input[type="checkbox"]:checked ~ .dot { transform: translateX(100%); background-color: white; }
    </style>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM 映射
            const inputQuantity = document.getElementById('input-quantity');
            const sliderQuantity = document.getElementById('slider-quantity');
            const toggleHyphens = document.getElementById('toggle-hyphens');
            const toggleUppercase = document.getElementById('toggle-uppercase');
            
            const btnGenerate = document.getElementById('btn-generate');
            const btnCopy = document.getElementById('btn-copy');
            const btnDownload = document.getElementById('btn-download');
            
            const outputTextarea = document.getElementById('output-textarea');
            const outputCount = document.getElementById('output-count');
            const editorWrapper = document.getElementById('editor-wrapper');

            // --- UI 狀態與 Toast 系統 ---
            const showToast = (msg, isError = false) => {
                const toast = document.getElementById('toast');
                const icon = document.getElementById('toast-icon');
                
                document.getElementById('toast-msg').textContent = msg;
                
                if (isError) {
                    toast.classList.replace('bg-slate-800', 'bg-red-950');
                    toast.classList.replace('border-slate-700', 'border-red-900');
                    icon.className = 'ph-fill ph-warning-circle text-lg text-red-500';
                } else {
                    toast.classList.replace('bg-red-950', 'bg-slate-800');
                    toast.classList.replace('border-red-900', 'border-slate-700');
                    icon.className = 'ph-fill ph-check-circle text-lg text-hub-accent';
                }

                toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                }, 2000);
            };

            // --- 數量同步控制 ---
            inputQuantity.addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                if (isNaN(val) || val < 1) val = 1;
                if (val > 5000) val = 5000; // 防禦極端數值卡死瀏覽器
                sliderQuantity.value = val;
            });
            
            sliderQuantity.addEventListener('input', (e) => {
                inputQuantity.value = e.target.value;
            });

            // --- 核心密碼學引擎 (v4 UUID) ---
            const generateSingleUUID = () => {
                let uuid;
                // 優先使用硬體加速的 Web Crypto API
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    uuid = crypto.randomUUID();
                } else {
                    // 後備演算法 (Polyfill for older environments)
                    uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                        const r = Math.random() * 16 | 0;
                        const v = c === 'x' ? r : (r & 0x3 | 0x8);
                        return v.toString(16);
                    });
                }
                return uuid;
            };

            const executeGeneration = () => {
                const quantity = parseInt(inputQuantity.value) || 1;
                const keepHyphens = toggleHyphens.checked;
                const toUppercase = toggleUppercase.checked;
                
                let resultBuffer = [];
                
                // 批次鑄造迴圈
                for (let i = 0; i < quantity; i++) {
                    let uuid = generateSingleUUID();
                    
                    if (!keepHyphens) uuid = uuid.replace(/-/g, '');
                    if (toUppercase) uuid = uuid.toUpperCase();
                    
                    resultBuffer.push(uuid);
                }

                // 渲染輸出
                outputTextarea.value = resultBuffer.join('\n');
                outputCount.textContent = `${quantity} generated`;
                
                // 視覺反饋動畫
                editorWrapper.classList.remove('flash-active');
                void editorWrapper.offsetWidth; // 觸發 reflow
                editorWrapper.classList.add('flash-active');
                
                // 自動捲動到頂部
                outputTextarea.scrollTop = 0;
            };

            // --- 事件綁定 ---
            btnGenerate.addEventListener('click', executeGeneration);

            // 選項改變時，如果有現存資料，即時重新格式化 (不重新產生新的亂數，只變更格式)
            const reformatExisting = () => {
                if (!outputTextarea.value) return;
                const keepHyphens = toggleHyphens.checked;
                const toUppercase = toggleUppercase.checked;
                
                let lines = outputTextarea.value.split('\n');
                lines = lines.map(line => {
                    let text = line;
                    // 統一先處理連字號
                    if (!keepHyphens) {
                        text = text.replace(/-/g, '');
                    } else if (text.length === 32 && !text.includes('-')) {
                        // 嘗試補回連字號 (8-4-4-4-12)
                        text = `${text.slice(0,8)}-${text.slice(8,12)}-${text.slice(12,16)}-${text.slice(16,20)}-${text.slice(20)}`;
                    }
                    
                    // 處理大小寫
                    if (toUppercase) return text.toUpperCase();
                    else return text.toLowerCase();
                });
                
                outputTextarea.value = lines.join('\n');
            };

            toggleHyphens.addEventListener('change', reformatExisting);
            toggleUppercase.addEventListener('change', reformatExisting);

            // --- 匯出機制 ---
            btnCopy.addEventListener('click', () => {
                if (!outputTextarea.value) {
                    showToast('沒有可複製的內容', true);
                    return;
                }
                outputTextarea.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                showToast('已複製所有 UUID 到剪貼簿');
            });

            btnDownload.addEventListener('click', () => {
                if (!outputTextarea.value) {
                    showToast('沒有可下載的內容', true);
                    return;
                }
                const blob = new Blob([outputTextarea.value], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `ToolHub_UUIDs_${Date.now()}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // 初始化預設產生一組
            executeGeneration();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 找不到頁面 | ToolHub - 頁面不存在</title>
    <meta name="description" content="抱歉，您要尋找的頁面不存在。可能網址輸入錯誤或頁面已移除。請返回首頁或使用搜尋工具查找。">
    <meta name="robots" content="noindex, follow">
    <meta name="author" content="ToolHub">

    <meta property="og:title" content="404 找不到頁面 | ToolHub">
    <meta property="og:description" content="抱歉，您要尋找的頁面不存在。可能網址輸入錯誤或頁面已移除。">
    <meta property="og:url" content="https://toolhuben.com/404/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ToolHub">
    <meta property="og:locale" content="zh_TW">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="404 找不到頁面 | ToolHub">
    <meta name="twitter:description" content="抱歉，您要尋找的頁面不存在。可能網址輸入錯誤或頁面已移除。">

    <link rel="canonical" href="https://toolhuben.com/404/">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        hub: {
                            900: '#0B1120',
                            800: '#151F32',
                            700: '#1E293B',
                            accent: '#38BDF8',
                            teal: '#00E5FF',
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'glow-pulse': 'glow-pulse 2s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'glow-pulse': {
                            '0%, 100%': { opacity: '0.4' },
                            '50%': { opacity: '0.8' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B1120;
            color: #E2E8F0;
            background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; border: 2px solid #0B1120; }
        ::-webkit-scrollbar-thumb:hover { background: #38BDF8; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.1); }
            50% { box-shadow: 0 0 40px rgba(56, 189, 248, 0.2); }
        }
        .glow-card {
            animation: pulse-glow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative font-sans">

    <div id="component-header"></div>
    <div id="component-sidebar"></div>

    <main class="relative z-10 flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 animate-[fadeIn_0.5s_ease-out]">

        <div class="flex flex-col items-center justify-center min-h-[60vh] text-center">

            <!-- 404 Visual -->
            <div class="relative mb-8">
                <div class="text-8xl sm:text-9xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 via-blue-500 to-purple-600 select-none animate-float">
                    404
                </div>
                <!-- Decorative glow -->
                <div class="absolute -top-10 -left-10 w-40 h-40 bg-cyan-500/5 rounded-full blur-3xl animate-glow-pulse"></div>
                <div class="absolute -bottom-5 -right-5 w-32 h-32 bg-purple-500/5 rounded-full blur-3xl animate-glow-pulse" style="animation-delay: 1s;"></div>
            </div>

            <!-- Icon -->
            <div class="w-16 h-16 bg-hub-800/60 border border-hub-700 rounded-2xl flex items-center justify-center mx-auto mb-6 glow-card">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </div>

            <h1 class="text-2xl sm:text-3xl font-bold text-white mb-3">
              找不到此頁面
            </h1>
            <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto leading-relaxed mb-2">
                可能網址輸入錯誤，或頁面已移除。
            </p>
            <p class="text-slate-500 text-xs max-w-sm mx-auto mb-8">
                請檢查網址是否正確，或透過以下方式繼續瀏覽。
            </p>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3">
                <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-hub-accent/10 border border-hub-accent/30 rounded-xl text-hub-accent hover:bg-hub-accent/20 transition-all text-sm font-medium">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    返回首頁
                </a>
                <button id="search-tools-btn" onclick="window.location.href='/'" class="inline-flex items-center gap-2 px-6 py-3 bg-hub-800 border border-hub-700 rounded-xl text-slate-400 hover:text-white hover:border-hub-accent/30 transition-all text-sm font-medium">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    瀏覽所有工具
                </button>
            </div>
        </div>

    </main>

    <div id="component-footer"></div>

    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                const container = document.getElementById(elementId);
                container.innerHTML = html;
                Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                console.error(`[System Error] 模組 ${filePath} 載入失敗:`, error);
            }
        }

        function setupEventDelegation() {
            document.body.addEventListener('click', (e) => {
                const triggerBtn = e.target.closest('#sidebar-trigger-btn');
                const closeBtn = e.target.closest('#sidebar-close-btn');
                const overlayLayer = e.target.closest('#sidebar-overlay');
                if (triggerBtn || closeBtn || overlayLayer) {
                    const container = document.getElementById('sidebar-container');
                    const overlay = document.getElementById('sidebar-overlay');
                    if (container && overlay) {
                        const isClosed = container.classList.contains('translate-x-full');
                        if (isClosed && triggerBtn) {
                            overlay.classList.remove('pointer-events-none');
                            requestAnimationFrame(() => {
                                container.classList.remove('translate-x-full');
                                overlay.classList.remove('opacity-0');
                                overlay.classList.add('opacity-100');
                            });
                        } else if (!isClosed && (closeBtn || overlayLayer || triggerBtn)) {
                            container.classList.add('translate-x-full');
                            overlay.classList.remove('opacity-100');
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.classList.add('pointer-events-none'), 300);
                        }
                    }
                }
            });
        }

        function setupSidebarActiveState() {
            const currentPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('#sidebar-container .nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (!href) return;
                const itemPath = href.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
                if (currentPath === itemPath || (currentPath !== '/' && itemPath !== '/' && currentPath.startsWith(itemPath))) {
                    item.classList.remove('text-slate-400', 'border-transparent', 'hover:bg-slate-800/50');
                    item.classList.add('text-[#3ebcf0]', 'border-[#3ebcf0]', 'bg-slate-800/70', 'shadow-[inset_0_0_10px_rgba(62,188,240,0.05)]');
                    const icon = item.querySelector('svg');
                    if (icon) icon.classList.add('text-[#3ebcf0]');
                }
            });
        }

        async function initializeSystem() {
            await Promise.all([
                loadComponent('component-header', '/components/header.html'),
                loadComponent('component-sidebar', '/components/sidebar.html'),
                loadComponent('component-footer', '/components/footer.html')
            ]);
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            setupEventDelegation();
            setupSidebarActiveState();
        }

        document.addEventListener('DOMContentLoaded', initializeSystem);
    </script>
</body>
</html>

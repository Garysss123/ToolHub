<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron Expression Parser | ToolHub - 視覺化排程解析與時空預測</title>
    <meta name="description" content="專業的 Cron 表達式解析器。提供即時中文白話文翻譯、動態結構解體、未來 10 次執行時間預測，並支援跨時區 (UTC/Local) 映射。純前端安全運算，開發者必備排程除錯工具。">
    
    <!-- 系統核心依賴 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- 模塊專屬依賴：統一使用 unpkg 以確保高可用性 -->
    <script src="https://unpkg.com/cronstrue@2.47.0/dist/cronstrue-i18n.min.js"></script>
    <script src="https://unpkg.com/croner@8.0.0/dist/croner.umd.js"></script>

    <script>
        // 融合系統核心色系
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hub: {
                            900: '#0B1120',
                            800: '#151F32',
                            700: '#1E293B',
                            accent: '#38BDF8',
                        },
                        cron: {
                            sec: '#f43f5e',   // Rose
                            min: '#38bdf8',   // Sky
                            hour: '#c084fc',  // Fuchsia
                            day: '#34d399',   // Emerald
                            month: '#fbbf24', // Amber
                            week: '#fb923c'   // Orange
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"Fira Code"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B1120;
            color: #E2E8F0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 10px; border: 2px solid #0B1120; }
        ::-webkit-scrollbar-thumb:hover { background: #38BDF8; }

        .glass-panel {
            background-color: rgba(21, 31, 50, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid #1E293B;
            border-radius: 1rem;
        }

        .anatomy-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .anatomy-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="flex flex-col min-h-screen relative font-sans">

    <!-- 1. 系統組件：Header -->
    <div id="component-header"></div>
    <!-- 2. 系統組件：Sidebar -->
    <div id="component-sidebar"></div>

    <!-- 3. 核心模塊：Cron Parser -->
    <main class="relative z-10 flex-grow w-full max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16 animate-[fadeIn_0.5s_ease-out]">
        
        <!-- 模塊標題區 -->
        <div class="text-center space-y-4 mb-8 mt-2">
            <div class="inline-flex items-center justify-center p-2 mb-1 rounded-full bg-hub-800 border border-hub-700 text-xs text-hub-accent shadow-inner">
                <span class="flex w-2 h-2 bg-hub-accent rounded-full animate-pulse mr-2"></span>
                週期排程推演矩陣 (高容錯隔離版) 已啟動
            </div>
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-white">
                Cron Expression <span class="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-sky-400">Parser</span>
            </h1>
            <p class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed">
                將反人類的排程咒語視覺化。提供即時中文白話文翻譯、動態結構解體，並支援跨時區推演未來執行軌跡。
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- ========================================== -->
            <!-- 上半部：輸入與解體矩陣 (Input & Anatomy)      -->
            <!-- ========================================== -->
            <div class="lg:col-span-12 glass-panel p-6 sm:p-8 flex flex-col gap-8 shadow-2xl">
                
                <!-- 咒語輸入與白話文翻譯 -->
                <div class="flex flex-col gap-4">
                    <div class="flex justify-between items-end">
                        <label class="text-sm font-bold text-hub-accent uppercase tracking-widest flex items-center gap-2">
                            <i class="ph-fill ph-magic-wand text-lg"></i> Cron Expression
                        </label>
                        <div id="cron-status" class="px-3 py-1 rounded-md text-xs font-bold bg-emerald-900/50 text-emerald-400 border border-emerald-500/30">
                            Valid Format
                        </div>
                    </div>
                    
                    <input type="text" id="cron-input" value="0 12 * * 1-5" class="w-full bg-hub-900/80 border-2 border-hub-700 rounded-xl px-6 py-5 text-3xl sm:text-4xl text-white font-mono text-center focus:border-hub-accent outline-none transition-all shadow-inner tracking-[0.5em]">
                    
                    <!-- 白話文翻譯面板 -->
                    <div class="bg-hub-800 border border-hub-700 rounded-xl p-4 sm:p-6 text-center relative overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-hub-accent/5 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
                        <span class="text-xs text-slate-500 uppercase tracking-widest font-bold mb-2 block">Translation</span>
                        <p id="human-readable" class="text-lg sm:text-xl font-bold text-sky-300 drop-shadow-md">--</p>
                    </div>
                </div>

                <!-- 動態結構解體 (Anatomy Cards) -->
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-400 uppercase tracking-widest font-bold">Structure Anatomy</span>
                        <span id="format-type-badge" class="text-[10px] text-slate-500 font-mono bg-hub-900 px-2 py-1 rounded border border-hub-700">Standard 5-part</span>
                    </div>
                    <div id="anatomy-container" class="flex flex-wrap gap-3 sm:gap-4 justify-center sm:justify-start">
                        <!-- 卡片由 JS 動態生成 -->
                    </div>
                </div>

            </div>

            <!-- ========================================== -->
            <!-- 左下部：兵器庫 (Snippets & Presets)          -->
            <!-- ========================================== -->
            <div class="lg:col-span-5 glass-panel p-6 flex flex-col gap-4 shadow-xl">
                <div class="flex items-center gap-2 border-b border-hub-700 pb-3">
                    <i class="ph ph-books text-fuchsia-400 text-xl"></i>
                    <h3 class="text-base font-bold text-white">常用排程兵器庫</h3>
                </div>
                <p class="text-xs text-slate-400">點擊直接載入標準排程，省去手寫的麻煩。</p>
                
                <div class="space-y-2 overflow-y-auto pr-2 max-h-[400px]">
                    <button class="preset-btn w-full flex flex-col items-start bg-hub-900/50 hover:bg-hub-800 border border-hub-700 p-3 rounded-lg transition-colors group" data-cron="* * * * *">
                        <span class="text-sm font-bold text-slate-200 group-hover:text-hub-accent">每分鐘執行 (Every minute)</span>
                        <span class="text-xs font-mono text-slate-500 mt-1">* * * * *</span>
                    </button>
                    <button class="preset-btn w-full flex flex-col items-start bg-hub-900/50 hover:bg-hub-800 border border-hub-700 p-3 rounded-lg transition-colors group" data-cron="*/5 * * * *">
                        <span class="text-sm font-bold text-slate-200 group-hover:text-hub-accent">每 5 分鐘執行 (Every 5 mins)</span>
                        <span class="text-xs font-mono text-slate-500 mt-1">*/5 * * * *</span>
                    </button>
                    <button class="preset-btn w-full flex flex-col items-start bg-hub-900/50 hover:bg-hub-800 border border-hub-700 p-3 rounded-lg transition-colors group" data-cron="0 * * * *">
                        <span class="text-sm font-bold text-slate-200 group-hover:text-hub-accent">每小時整點執行 (Every hour)</span>
                        <span class="text-xs font-mono text-slate-500 mt-1">0 * * * *</span>
                    </button>
                    <button class="preset-btn w-full flex flex-col items-start bg-hub-900/50 hover:bg-hub-800 border border-hub-700 p-3 rounded-lg transition-colors group" data-cron="0 0 * * *">
                        <span class="text-sm font-bold text-slate-200 group-hover:text-hub-accent">每日午夜執行 (Midnight daily)</span>
                        <span class="text-xs font-mono text-slate-500 mt-1">0 0 * * *</span>
                    </button>
                    <button class="preset-btn w-full flex flex-col items-start bg-hub-900/50 hover:bg-hub-800 border border-hub-700 p-3 rounded-lg transition-colors group" data-cron="0 12 * * 1-5">
                        <span class="text-sm font-bold text-slate-200 group-hover:text-hub-accent">工作日中午執行 (Weekday noon)</span>
                        <span class="text-xs font-mono text-slate-500 mt-1">0 12 * * 1-5</span>
                    </button>
                    <button class="preset-btn w-full flex flex-col items-start bg-hub-900/50 hover:bg-hub-800 border border-hub-700 p-3 rounded-lg transition-colors group" data-cron="0 0 1 * *">
                        <span class="text-sm font-bold text-slate-200 group-hover:text-hub-accent">每月第一天執行 (1st of month)</span>
                        <span class="text-xs font-mono text-slate-500 mt-1">0 0 1 * *</span>
                    </button>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- 右下部：未來時空投影儀 (Next Executions)       -->
            <!-- ========================================== -->
            <div class="lg:col-span-7 glass-panel p-0 flex flex-col shadow-xl overflow-hidden">
                
                <div class="bg-hub-900/80 px-6 py-4 border-b border-hub-700 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                    <div class="flex items-center gap-2">
                        <i class="ph ph-calendar-check text-emerald-400 text-xl"></i>
                        <h3 class="text-base font-bold text-white">未來軌跡推演 (Next Executions)</h3>
                    </div>
                    
                    <!-- 時區投影切換器 -->
                    <div class="flex items-center bg-hub-800 rounded-lg p-1 border border-hub-700 relative text-xs font-bold shrink-0">
                        <label class="flex items-center gap-2 cursor-pointer px-3 py-1.5 rounded-md transition-colors text-slate-300 hover:text-white">
                            <input type="radio" name="tz-mode" value="local" checked class="hidden peer">
                            <span class="peer-checked:text-emerald-400">Local Time</span>
                        </label>
                        <div class="w-px h-4 bg-hub-600 mx-1"></div>
                        <label class="flex items-center gap-2 cursor-pointer px-3 py-1.5 rounded-md transition-colors text-slate-300 hover:text-white">
                            <input type="radio" name="tz-mode" value="utc" class="hidden peer">
                            <span class="peer-checked:text-sky-400">UTC</span>
                        </label>
                    </div>
                </div>

                <div class="p-6 flex-grow bg-hub-900/30">
                    <ul id="execution-list" class="space-y-3">
                        <!-- JS 動態生成時間列表 -->
                    </ul>
                </div>
                
            </div>

        </div>
    </main>

    <!-- 全域 Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white border border-slate-700 px-6 py-3 rounded-full font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300 z-[100] flex items-center gap-2 translate-y-4">
        <i class="ph-fill ph-check-circle text-lg text-hub-accent" id="toast-icon"></i> 
        <span id="toast-msg">操作成功</span>
    </div>

    <!-- 4. 動態載入：頁尾 (Footer) -->
    <div id="component-footer"></div>

    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                const container = document.getElementById(elementId);
                container.innerHTML = html;
                Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {}
        }

        function setupSidebarActiveState() {
            const currentPath = '/cron-parser';
            document.querySelectorAll('#sidebar-container .nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (!href) return;
                const itemPath = href.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
                if (currentPath === itemPath || (currentPath !== '/' && itemPath !== '/' && currentPath.startsWith(itemPath))) {
                    item.classList.remove('text-slate-400', 'border-transparent', 'hover:bg-slate-800/50');
                    item.classList.add('text-[#3ebcf0]', 'border-[#3ebcf0]', 'bg-slate-800/70', 'shadow-[inset_0_0_10px_rgba(62,188,240,0.05)]');
                }
            });
        }

        async function initializeSystem() {
            await Promise.all([
                loadComponent('component-header', '/components/header.html'),
                loadComponent('component-sidebar', '/components/sidebar.html'),
                loadComponent('component-footer', '/components/footer.html')
            ]);
            if (typeof lucide !== 'undefined') lucide.createIcons();
            document.body.addEventListener('click', (e) => {
                const triggerBtn = e.target.closest('#sidebar-trigger-btn');
                const closeBtn = e.target.closest('#sidebar-close-btn');
                const overlayLayer = e.target.closest('#sidebar-overlay');
                if (triggerBtn || closeBtn || overlayLayer) {
                    const container = document.getElementById('sidebar-container');
                    const overlay = document.getElementById('sidebar-overlay');
                    if (container && overlay) {
                        const isClosed = container.classList.contains('translate-x-full');
                        if (isClosed && triggerBtn) {
                            overlay.classList.remove('pointer-events-none');
                            requestAnimationFrame(() => {
                                container.classList.remove('translate-x-full');
                                overlay.classList.remove('opacity-0');
                                overlay.classList.add('opacity-100');
                            });
                        } else if (!isClosed && (closeBtn || overlayLayer || triggerBtn)) {
                            container.classList.add('translate-x-full');
                            overlay.classList.remove('opacity-100');
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.classList.add('pointer-events-none'), 300);
                        }
                    }
                }
            });
            setupSidebarActiveState();
        }

        document.addEventListener('DOMContentLoaded', initializeSystem);
    </script>

    <!-- ========================================== -->
    <!-- 工具級業務邏輯：Cron 解析與推演矩陣            -->
    <!-- ========================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const showToast = (msg) => {
                const toast = document.getElementById('toast');
                document.getElementById('toast-msg').textContent = msg;
                toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');
                clearTimeout(window.toastTimer);
                window.toastTimer = setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
                }, 2000);
            };

            const cronInput = document.getElementById('cron-input');
            const cronStatus = document.getElementById('cron-status');
            const humanReadable = document.getElementById('human-readable');
            const anatomyContainer = document.getElementById('anatomy-container');
            const formatTypeBadge = document.getElementById('format-type-badge');
            
            const executionList = document.getElementById('execution-list');
            const tzRadios = document.getElementsByName('tz-mode');

            const partsConfig = {
                second: { label: 'Second', desc: '0-59', colorClass: 'border-t-cron-sec', textClass: 'text-cron-sec' },
                minute: { label: 'Minute', desc: '0-59', colorClass: 'border-t-cron-min', textClass: 'text-cron-min' },
                hour: { label: 'Hour', desc: '0-23', colorClass: 'border-t-cron-hour', textClass: 'text-cron-hour' },
                dayMonth: { label: 'Day(Month)', desc: '1-31', colorClass: 'border-t-cron-day', textClass: 'text-cron-day' },
                month: { label: 'Month', desc: '1-12', colorClass: 'border-t-cron-month', textClass: 'text-cron-month' },
                dayWeek: { label: 'Day(Week)', desc: '0-6', colorClass: 'border-t-cron-week', textClass: 'text-cron-week' }
            };

            const renderExecutionList = (dates, tzMode) => {
                executionList.innerHTML = '';
                if (dates.length === 0) {
                    executionList.innerHTML = '<li class="text-slate-500 text-sm text-center py-4">無法計算下一次執行時間。</li>';
                    return;
                }

                const now = new Date();
                const pad = (n) => n.toString().padStart(2, '0');

                dates.forEach((date, index) => {
                    let dateStr = '';
                    if (tzMode === 'utc') {
                        dateStr = `${date.getUTCFullYear()}-${pad(date.getUTCMonth()+1)}-${pad(date.getUTCDate())} ${pad(date.getUTCHours())}:${pad(date.getUTCMinutes())}:${pad(date.getUTCSeconds())} UTC`;
                    } else {
                        dateStr = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
                    }

                    const diffMs = date.getTime() - now.getTime();
                    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                    const diffHrs = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    
                    let relativeStr = 'in ';
                    if (diffDays > 0) relativeStr += `${diffDays}d `;
                    if (diffHrs > 0) relativeStr += `${diffHrs}h `;
                    relativeStr += `${diffMins}m`;
                    if (diffMs < 60000) relativeStr = '即將執行 (Less than 1 min)';

                    const li = document.createElement('li');
                    li.className = 'flex flex-col sm:flex-row sm:justify-between sm:items-center bg-hub-800/80 border border-hub-700 rounded-lg p-3 sm:px-4 hover:border-sky-500/30 transition-colors gap-1';
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-[10px] font-bold bg-hub-900 text-slate-400 px-2 py-1 rounded w-8 text-center shrink-0">#${index + 1}</span>
                            <span class="text-sm font-mono font-bold ${tzMode === 'utc' ? 'text-sky-300' : 'text-emerald-400'}">${dateStr}</span>
                        </div>
                        <span class="text-xs text-slate-500 font-mono sm:text-right pl-11 sm:pl-0">${relativeStr}</span>
                    `;
                    executionList.appendChild(li);
                });
            };

            const parseCron = () => {
                const rawVal = cronInput.value;
                const val = rawVal.trim().replace(/\s+/g, ' ');
                
                if (!val) {
                    cronStatus.innerHTML = 'Empty';
                    cronStatus.className = 'px-3 py-1 rounded-md text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700';
                    humanReadable.textContent = '請輸入 Cron 表達式';
                    humanReadable.className = 'text-lg sm:text-xl font-bold text-slate-500';
                    anatomyContainer.innerHTML = '';
                    executionList.innerHTML = '<li class="text-slate-500 text-sm text-center py-4">等待輸入...</li>';
                    return;
                }

                // 1. 動態解體
                const parts = val.split(' ');
                const isSixParts = parts.length === 6;
                const isFiveParts = parts.length === 5;
                
                anatomyContainer.innerHTML = '';
                if (isFiveParts || isSixParts) {
                    formatTypeBadge.textContent = isSixParts ? 'Extended 6-part (with Seconds)' : 'Standard 5-part';
                    const structure = isSixParts 
                        ? ['second', 'minute', 'hour', 'dayMonth', 'month', 'dayWeek']
                        : ['minute', 'hour', 'dayMonth', 'month', 'dayWeek'];

                    structure.forEach((partKey, index) => {
                        const conf = partsConfig[partKey];
                        const card = document.createElement('div');
                        card.className = `anatomy-card flex-1 min-w-[80px] sm:min-w-[100px] bg-hub-900 border-t-4 border-b border-l border-r border-hub-700 rounded-lg p-3 text-center ${conf.colorClass}`;
                        card.innerHTML = `
                            <div class="text-2xl sm:text-3xl font-mono font-bold text-white mb-1 drop-shadow-md break-all">${parts[index]}</div>
                            <div class="text-[10px] sm:text-xs font-bold uppercase tracking-wider ${conf.textClass}">${conf.label}</div>
                            <div class="text-[9px] text-slate-500 font-mono mt-0.5">${conf.desc}</div>
                        `;
                        anatomyContainer.appendChild(card);
                    });
                } else {
                    formatTypeBadge.textContent = 'Invalid Format';
                    anatomyContainer.innerHTML = `<div class="text-amber-400/80 text-sm text-center w-full py-4"><i class="ph-fill ph-warning-circle"></i> 通常包含 5 或 6 個部分，以空格分隔。</div>`;
                }

                let isTranslationValid = true;

                // 2. 獨立防護區塊：白話文翻譯引擎
                try {
                    if (typeof cronstrue === 'undefined') throw new Error("翻譯引擎載入中...");
                    const desc = cronstrue.toString(val, { locale: 'zh_TW', use24HourTimeFormat: true });
                    humanReadable.textContent = desc;
                    humanReadable.className = 'text-lg sm:text-xl font-bold text-sky-300 drop-shadow-md';
                    
                    cronStatus.innerHTML = '<i class="ph-fill ph-check-circle"></i> Valid Format';
                    cronStatus.className = 'px-3 py-1 rounded-md text-xs font-bold bg-emerald-900/50 text-emerald-400 border border-emerald-500/30 flex items-center gap-1';
                } catch (e) {
                    isTranslationValid = false;
                    cronStatus.innerHTML = '<i class="ph-fill ph-warning-circle"></i> Error';
                    cronStatus.className = 'px-3 py-1 rounded-md text-xs font-bold bg-red-900/50 text-red-400 border border-red-500/30 flex items-center gap-1';
                    humanReadable.textContent = '語法錯誤：' + e.toString().replace('Error: ', '');
                    humanReadable.className = 'text-base font-bold text-red-400 mt-2';
                    executionList.innerHTML = '<li class="text-red-400/80 text-sm text-center py-4">無法預測，請修正語法錯誤。</li>';
                }

                // 3. 獨立防護區塊：未來推演引擎 (僅當翻譯成功才推演，避免無效輸入引發崩潰)
                if (isTranslationValid) {
                    try {
                        const targetTimezone = document.querySelector('input[name="tz-mode"]:checked').value;
                        const jobOptions = {};
                        if (targetTimezone === 'utc') jobOptions.timezone = 'UTC';
                        
                        // 動態擷取 CronEngine，防禦 CDN 封裝差異
                        const CronEngine = window.Cron || window.croner || (window.croner && window.croner.Cron);
                        
                        if (!CronEngine) {
                            throw new Error('預測引擎載入失敗，請檢查網路狀態');
                        }
                        
                        const job = new CronEngine(val, jobOptions);
                        
                        const nextDates = [];
                        let nextDate = job.next();
                        for(let i=0; i<10; i++) {
                            if(!nextDate) break; 
                            nextDates.push(nextDate);
                            nextDate = job.next(nextDate);
                        }

                        renderExecutionList(nextDates, targetTimezone);

                    } catch (e) {
                        executionList.innerHTML = `<li class="text-amber-400/80 text-sm text-center py-4"><i class="ph-fill ph-warning-circle"></i> 推演失敗：${e.message}</li>`;
                    }
                }
            };

            cronInput.addEventListener('input', parseCron);
            Array.from(tzRadios).forEach(radio => radio.addEventListener('change', parseCron));

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    cronInput.value = e.currentTarget.dataset.cron;
                    parseCron();
                    showToast('已載入預設排程');
                    cronInput.classList.add('bg-hub-800');
                    setTimeout(() => cronInput.classList.remove('bg-hub-800'), 300);
                });
            });

            // 確保依賴載入後再觸發初始解析 (簡單的延遲防禦)
            setTimeout(parseCron, 100);
        });
    </script>
</body>
</html>

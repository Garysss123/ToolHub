    <!-- 系統級中樞神經：負責組件載入與事件代理        -->
    <!-- ========================================== -->
    <script>
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                const container = document.getElementById(elementId);
                container.innerHTML = html;

                // 核心升級：擷取並重新喚醒組件內部的 <script> 標籤
                Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    // 複製所有屬性 (例如 type="text/javascript")
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    // 複製腳本內容
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    // 替換舊節點，這會強制瀏覽器執行這段程式碼
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                console.error(`[System Error] 模組 ${filePath} 載入失敗:`, error);
            }
        }

        function setupEventDelegation() {
            document.body.addEventListener('click', (e) => {
                const triggerBtn = e.target.closest('#sidebar-trigger-btn');
                const closeBtn = e.target.closest('#sidebar-close-btn');
                const overlayLayer = e.target.closest('#sidebar-overlay');

                if (triggerBtn || closeBtn || overlayLayer) {
                    const container = document.getElementById('sidebar-container');
                    const overlay = document.getElementById('sidebar-overlay');
                    
                    if (container && overlay) {
                        const isClosed = container.classList.contains('translate-x-full');
                        if (isClosed && triggerBtn) {
                            overlay.classList.remove('pointer-events-none');
                            requestAnimationFrame(() => {
                                container.classList.remove('translate-x-full');
                                overlay.classList.remove('opacity-0');
                                overlay.classList.add('opacity-100');
                            });
                        } else if (!isClosed && (closeBtn || overlayLayer || triggerBtn)) {
                            container.classList.add('translate-x-full');
                            overlay.classList.remove('opacity-100');
                            overlay.classList.add('opacity-0');
                            setTimeout(() => overlay.classList.add('pointer-events-none'), 300);
                        }
                    }
                }
            });
        }

        function setupSidebarActiveState() {
            const currentPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
            document.querySelectorAll('#sidebar-container .nav-item').forEach(item => {
                const href = item.getAttribute('href');
                if (!href) return;
                const itemPath = href.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
                if (currentPath === itemPath || (currentPath !== '/' && itemPath !== '/' && currentPath.startsWith(itemPath))) {
                    item.classList.remove('text-slate-400', 'border-transparent', 'hover:bg-slate-800/50');
                    item.classList.add('text-[#3ebcf0]', 'border-[#3ebcf0]', 'bg-slate-800/70', 'shadow-[inset_0_0_10px_rgba(62,188,240,0.05)]');
                    const icon = item.querySelector('svg');
                    if (icon) icon.classList.add('text-[#3ebcf0]');
                }
            });
        }

        async function initializeSystem() {
            // 平行載入所有全局元件
            await Promise.all([
                loadComponent('component-header', '/components/header.html'),
                loadComponent('component-sidebar', '/components/sidebar.html'),
                loadComponent('component-footer', '/components/footer.html')
            ]);
            
            // 渲染殼層所需要的 Lucide Icons
            if (typeof lucide !== 'undefined') lucide.createIcons();
            
            // 啟動系統級防禦網與側邊欄控制
            setupEventDelegation();
            setupSidebarActiveState();
        }

        // 啟動系統框架
        document.addEventListener('DOMContentLoaded', initializeSystem);
    </script>

            // --- Core Application State ---
            let currentLang = 'zh'; 
            const posTextarea = document.getElementById('positivePrompt');
            const negTextarea = document.getElementById('negativePrompt');
            const posTagsContainer = document.getElementById('posTags');
            const negTagsContainer = document.getElementById('negTags');
            const langToggleBtn = document.getElementById('langToggleBtn');

            langToggleBtn.addEventListener('click', () => {
                currentLang = currentLang === 'zh' ? 'en' : 'zh';
                langToggleBtn.querySelector('span').textContent = currentLang === 'zh' ? '介面語言: 中文' : '介面語言: English';
                buildTagPanel(posPromptData, posTagsContainer, 'pos');
                buildTagPanel(negPromptData, negTagsContainer, 'neg');
                updateUI(); 
            });

            // 手風琴折疊面板渲染邏輯
            function buildTagPanel(data, container, type) {
                container.innerHTML = '';
                let count = 0;

                for (const [category, tags] of Object.entries(data)) {
                    const isOpen = count < 2; 
                    
                    const item = document.createElement('div');
                    item.className = `accordion-item ${isOpen ? 'open' : ''}`;
                    
                    const header = document.createElement('button');
                    header.className = 'accordion-header';
                    
                    const badgeId = `badge-${type}-${category.replace(/[\s\W]+/g, '-')}`;
                    header.innerHTML = `
                        <div style="display:flex; align-items:center;">
                            ${category} <span class="acc-badge" id="${badgeId}">0</span>
                        </div>
                        <i class="ph ph-caret-down"></i>
                    `;
                    
                    header.addEventListener('click', () => {
                        item.classList.toggle('open');
                    });

                    const content = document.createElement('div');
                    content.className = 'accordion-content';
                    
                    const inner = document.createElement('div');
                    inner.className = 'accordion-inner tag-list';
                    
                    tags.forEach(tagObj => {
                        const btn = document.createElement('button');
                        btn.className = 'tag-btn';
                        btn.textContent = currentLang === 'zh' ? tagObj.zh : tagObj.en; 
                        btn.dataset.en = tagObj.en; 
                        btn.dataset.type = type;
                        btn.dataset.category = category; 
                        btn.addEventListener('click', () => toggleTag(tagObj.en, type));
                        inner.appendChild(btn);
                    });
                    
                    content.appendChild(inner);
                    item.appendChild(header);
                    item.appendChild(content);
                    container.appendChild(item);

                    count++;
                }
            }

            function getTagsArray(text) {
                if (!text.trim()) return [];
                return text.split(',').map(t => t.trim()).filter(t => t.length > 0);
            }

            function toggleTag(enTag, type) {
                const textarea = type === 'pos' ? posTextarea : negTextarea;
                let currentTags = getTagsArray(textarea.value);
                const index = currentTags.indexOf(enTag);
                
                if (index > -1) { currentTags.splice(index, 1); } 
                else { currentTags.push(enTag); }
                
                textarea.value = currentTags.join(', ');
                updateUI();
            }

            function updateUI() {
                const posArray = getTagsArray(posTextarea.value);
                const negArray = getTagsArray(negTextarea.value);

                // Positive UI Sync
                const posCategoryCounts = {};
                posTagsContainer.querySelectorAll('.tag-btn').forEach(btn => {
                    const cat = btn.dataset.category;
                    posCategoryCounts[cat] = posCategoryCounts[cat] || 0;
                    
                    if (posArray.includes(btn.dataset.en)) {
                        btn.classList.add('active');
                        posCategoryCounts[cat]++;
                    } else {
                        btn.classList.remove('active');
                    }
                });

                for(const [cat, count] of Object.entries(posCategoryCounts)) {
                    const badgeId = `badge-pos-${cat.replace(/[\s\W]+/g, '-')}`;
                    const badge = document.getElementById(badgeId);
                    if(badge) {
                        badge.textContent = count;
                        if(count > 0) badge.classList.add('active');
                        else badge.classList.remove('active');
                    }
                }

                // Negative UI Sync
                const negCategoryCounts = {};
                negTagsContainer.querySelectorAll('.tag-btn').forEach(btn => {
                    const cat = btn.dataset.category;
                    negCategoryCounts[cat] = negCategoryCounts[cat] || 0;

                    if (negArray.includes(btn.dataset.en)) {
                        btn.classList.add('active');
                        negCategoryCounts[cat]++;
                    } else {
                        btn.classList.remove('active');
                    }
                });

                for(const [cat, count] of Object.entries(negCategoryCounts)) {
                    const badgeId = `badge-neg-${cat.replace(/[\s\W]+/g, '-')}`;
                    const badge = document.getElementById(badgeId);
                    if(badge) {
                        badge.textContent = count;
                        if(count > 0) badge.classList.add('active');
                        else badge.classList.remove('active');
                    }
                }

                document.getElementById('posCount').textContent = `${posArray.length} tags`;
                document.getElementById('negCount').textContent = `${negArray.length} tags`;
            }

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tags-panel').forEach(p => p.classList.remove('active'));
                    
                    const targetId = e.currentTarget.dataset.target;
                    e.currentTarget.classList.add('active');
                    document.getElementById(targetId).classList.add('active');
                });
            });

            posTextarea.addEventListener('input', updateUI);
            negTextarea.addEventListener('input', updateUI);

            document.querySelectorAll('.model-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            function copyToClipboard(textElement, typeName) {
                textElement.select();
                textElement.setSelectionRange(0, 99999);
                try {
                    navigator.clipboard.writeText(textElement.value).then(() => showToast(`已複製 ${typeName} Prompt`));
                } catch (err) {
                    document.execCommand('copy');
                    showToast(`已複製 ${typeName} Prompt`);
                }
                window.getSelection().removeAllRanges();
            }

            function showToast(msg) {
                const toast = document.getElementById('toastMsg');
                document.getElementById('toastText').textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2500);
            }

            document.getElementById('btnCopyPos').addEventListener('click', () => copyToClipboard(posTextarea, '正向'));
            document.getElementById('btnCopyNeg').addEventListener('click', () => copyToClipboard(negTextarea, '負向'));

            document.getElementById('btnClearPos').addEventListener('click', () => { 
                posTextarea.value = ''; updateUI(); 
            });

            document.getElementById('btnRandom').addEventListener('click', () => {
                const randomTags = [];
                const categories = Object.keys(posPromptData).filter(k => !k.includes("模型特定起手式"));
                
                for (const key of categories) {
                    const tags = posPromptData[key];
                    if (Math.random() > 0.6) { 
                        const randomIndex = Math.floor(Math.random() * tags.length);
                        randomTags.push(tags[randomIndex].en);
                    }
                }
                
                posTextarea.value = randomTags.join(', ');
                updateUI();
            });

            // --- 初始化啟動 ---
            buildTagPanel(posPromptData, posTagsContainer, 'pos');
            buildTagPanel(negPromptData, negTagsContainer, 'neg');
            updateUI();
        });

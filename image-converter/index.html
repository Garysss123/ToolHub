<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片影像格式轉換工具 | ToolHub</title>
  
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <script>
    // 融合系統核心色系與本模塊的客製化設定
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            brand: '#2cb8f3',
            hub: {
                900: '#0B1120',
                800: '#151F32',
                700: '#1E293B',
                accent: '#38BDF8',
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out',
            'spin-slow': 'spin 1.5s linear infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 隱藏捲軸但保留功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Range Slider 客製化 */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: #2cb8f3; cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #2cb8f3; cursor: pointer; border: none;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 font-sans selection:bg-cyan-900 selection:text-cyan-50 flex flex-col relative">

  <!-- 科技感網格背景 (底層) -->
  <div class="fixed inset-0 pointer-events-none z-0 opacity-20"
       style="background-image: linear-gradient(to right, #1e293b 1px, transparent 1px), linear-gradient(to bottom, #1e293b 1px, transparent 1px); background-size: 40px 40px;">
  </div>

  <!-- 1. 動態載入：頂部導航欄 (Header) -->
  <div id="component-header"></div>

  <!-- 2. 動態載入：側邊欄 (Sidebar) -->
  <div id="component-sidebar"></div>

  <!-- 3. 核心內容區域 (Tool Module) -->
  <main class="relative z-10 flex-grow w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8 animate-fade-in">
    
    <div class="flex flex-col gap-2 mb-8 mt-4">
      <div class="inline-flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-full px-3 py-1.5 w-fit shadow-lg shadow-black/50">
        <span class="w-2 h-2 rounded-full bg-[#2cb8f3] shadow-[0_0_8px_rgba(44,184,243,0.8)] animate-pulse"></span>
        <span class="text-xs text-slate-300 tracking-wide">模塊就緒：專業影像圖片轉換引擎</span>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight mt-1">
        圖片影像<span class="text-transparent bg-clip-text bg-gradient-to-r from-[#2cb8f3] to-purple-400">格式轉換工具</span>
      </h1>
      <p class="text-slate-400 text-sm md:text-base max-w-2xl leading-relaxed mt-2">
        在這裡，您可以輕鬆將圖片轉換為各種常用格式（JPG, PNG, WEBP 等）。所有的轉換處理都在您的瀏覽器端完成，確保您的資料隱私與最高運作效率。
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- 左側：上傳區塊 -->
      <div class="bg-[#0f1523] border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-full min-h-[350px]">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold text-white flex items-center gap-2">
            <i data-lucide="upload-cloud" class="w-5 h-5 text-[#2cb8f3]"></i>
            輸入來源
          </h2>
          <button id="reset-btn" class="hidden text-xs text-slate-400 hover:text-white transition-colors py-1 px-2 border border-slate-700 rounded-md bg-slate-800">
            重新選擇
          </button>
        </div>

        <div id="drop-zone" class="flex-1 flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-[#2cb8f3]/50 rounded-xl bg-slate-900/50 transition-colors cursor-pointer group">
          <div class="p-4 bg-slate-800 rounded-full group-hover:scale-110 group-hover:bg-[#2cb8f3]/20 transition-all duration-300 mb-4">
            <i data-lucide="file-image" class="w-8 h-8 text-slate-400 group-hover:text-[#2cb8f3] transition-colors"></i>
          </div>
          <p class="text-slate-300 font-medium mb-1">點擊或拖曳圖片至此</p>
          <p class="text-slate-500 text-xs text-center max-w-[200px]">支援 JPG, PNG, WEBP, BMP 等格式</p>
        </div>

        <div id="preview-zone" class="hidden flex-1 flex flex-col border border-slate-700 rounded-xl bg-slate-900/50 overflow-hidden relative">
          <div class="p-2 bg-slate-800/80 backdrop-blur border-b border-slate-700 flex items-center gap-2 absolute top-0 left-0 right-0 z-10">
            <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_rgba(74,222,128,0.5)]"></div>
            <span id="file-name" class="text-xs text-slate-300 truncate max-w-[60%]">filename.png</span>
            <span id="file-size" class="text-xs text-[#2cb8f3] ml-auto font-medium">0 MB</span>
          </div>
          <div class="flex-1 p-8 pt-12 flex items-center justify-center bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAAXNSR0IArs4c6QAAACVJREFUKFNjZCASMDKgAhgZGBhQBEB2MUBkEIkGE2tQvI9QQwAA0cQCAyZ0Z1EAAAAASUVORK5CYII=')]">
            <img id="preview-img" src="" alt="預覽" class="max-h-[220px] max-w-full object-contain drop-shadow-2xl rounded-sm">
          </div>
        </div>
        <input type="file" id="file-input" accept="image/*" class="hidden">
      </div>

      <!-- 右側：設定與輸出區塊 -->
      <div class="bg-[#0f1523] border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col h-full relative overflow-hidden min-h-[350px]">
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-[#2cb8f3]/5 rounded-full blur-3xl pointer-events-none"></div>

        <h2 class="text-lg font-semibold text-white flex items-center gap-2 mb-6">
          <i data-lucide="settings" class="w-5 h-5 text-purple-400"></i>
          轉換參數
        </h2>

        <div class="space-y-6 flex-1 relative z-10">
          <div class="space-y-2">
            <label class="text-sm text-slate-400 block font-medium">目標格式</label>
            <div class="relative">
              <select id="format-select" class="w-full appearance-none bg-slate-900 border border-slate-700 text-white text-sm rounded-xl focus:ring-2 focus:ring-[#2cb8f3]/50 focus:border-[#2cb8f3] block p-3 pr-8 transition-all outline-none disabled:opacity-50 disabled:cursor-not-allowed">
                <option value="image/png" data-ext=".png">PNG (無損, 支援透明)</option>
                <option value="image/jpeg" data-ext=".jpg">JPG/JPEG (高壓縮, 移除透明背景)</option>
                <option value="image/webp" data-ext=".webp">WEBP (新世代格式, 體積小)</option>
                <option value="image/bmp" data-ext=".bmp">BMP (未壓縮點陣圖)</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
              </div>
            </div>
          </div>

          <div id="quality-container" class="space-y-2 hidden animate-fade-in">
            <div class="flex justify-between items-center">
              <label class="text-sm text-slate-400 font-medium">壓縮畫質</label>
              <span id="quality-display" class="text-sm font-bold text-[#2cb8f3] bg-[#2cb8f3]/10 px-2 py-0.5 rounded">90%</span>
            </div>
            <input type="range" id="quality-slider" min="0.1" max="1" step="0.05" value="0.9" class="w-full h-2 bg-slate-800 rounded-lg appearance-none disabled:opacity-50">
          </div>

          <div id="error-msg" class="hidden p-3 bg-red-900/30 border border-red-800 rounded-lg text-red-400 text-sm flex items-start gap-2">
            <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
            <span id="error-text">發生錯誤</span>
          </div>
        </div>

        <div class="mt-8 pt-6 border-t border-slate-800 relative z-10">
          
          <!-- 轉換按鈕 (堅如磐石的 SVG 狀態機) -->
          <button id="convert-btn" disabled class="w-full py-3.5 rounded-xl font-medium flex items-center justify-center gap-2 transition-all bg-slate-800 text-slate-500 cursor-not-allowed select-none">
            <!-- CPU Icon -->
            <svg id="btn-icon-cpu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
              <rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/>
            </svg>
            <!-- Spinner Icon (預設隱藏) -->
            <svg id="btn-icon-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 hidden animate-spin-slow">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/>
            </svg>
            <span id="convert-btn-text">等待來源輸入</span>
          </button>

          <!-- 下載按鈕 -->
          <div id="download-container" class="hidden animate-fade-in">
            <div class="flex items-center gap-2 mb-3 text-green-400 justify-center">
              <i data-lucide="check-circle-2" class="w-4 h-4"></i>
              <span class="text-sm font-medium tracking-wide">運算完成</span>
            </div>
            <a id="download-link" href="#" download="converted_image" class="w-full py-3.5 rounded-xl font-medium flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 hover:border-[#2cb8f3]/50 transition-all shadow-lg group">
              <i data-lucide="download" class="w-5 h-5 text-[#2cb8f3] group-hover:-translate-y-0.5 transition-transform"></i>
              下載轉換檔案
            </a>
          </div>

        </div>
      </div>
    </div>

    <!-- 隱藏的 Canvas -->
    <canvas id="conversion-canvas" class="hidden"></canvas>
  </main>

  <!-- 4. 動態載入：頁尾 (Footer) -->
  <div id="component-footer"></div>

  <!-- ========================================== -->
  <!-- 系統級中樞神經：負責組件載入與事件代理        -->
  <!-- ========================================== -->
  <script>
    async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                const container = document.getElementById(elementId);
                container.innerHTML = html;

                // 核心升級：擷取並重新喚醒組件內部的 <script> 標籤
                Array.from(container.querySelectorAll('script')).forEach(oldScript => {
                    const newScript = document.createElement('script');
                    // 複製所有屬性 (例如 type="text/javascript")
                    Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                    // 複製腳本內容
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    // 替換舊節點，這會強制瀏覽器執行這段程式碼
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                console.error(`[System Error] 模組 ${filePath} 載入失敗:`, error);
            }
        }

    function setupEventDelegation() {
      document.body.addEventListener('click', (e) => {
        const triggerBtn = e.target.closest('#sidebar-trigger-btn');
        const closeBtn = e.target.closest('#sidebar-close-btn');
        const overlayLayer = e.target.closest('#sidebar-overlay');

        if (triggerBtn || closeBtn || overlayLayer) {
            const container = document.getElementById('sidebar-container');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (container && overlay) {
                const isClosed = container.classList.contains('translate-x-full');
                if (isClosed && triggerBtn) {
                    overlay.classList.remove('pointer-events-none');
                    requestAnimationFrame(() => {
                        container.classList.remove('translate-x-full');
                        overlay.classList.remove('opacity-0');
                        overlay.classList.add('opacity-100');
                    });
                } else if (!isClosed && (closeBtn || overlayLayer || triggerBtn)) {
                    container.classList.add('translate-x-full');
                    overlay.classList.remove('opacity-100');
                    overlay.classList.add('opacity-0');
                    setTimeout(() => overlay.classList.add('pointer-events-none'), 300);
                }
            }
        }
      });
    }

    function setupSidebarActiveState() {
      const currentPath = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
      document.querySelectorAll('#sidebar-container .nav-item').forEach(item => {
          const href = item.getAttribute('href');
          if (!href) return;
          const itemPath = href.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
          if (currentPath === itemPath || (currentPath !== '/' && itemPath !== '/' && currentPath.startsWith(itemPath))) {
              item.classList.remove('text-slate-400', 'border-transparent', 'hover:bg-slate-800/50');
              item.classList.add('text-[#3ebcf0]', 'border-[#3ebcf0]', 'bg-slate-800/70', 'shadow-[inset_0_0_10px_rgba(62,188,240,0.05)]');
              const icon = item.querySelector('svg');
              if (icon) icon.classList.add('text-[#3ebcf0]');
          }
      });
    }

    async function initializeSystem() {
      // 載入全局元件 (採用絕對路徑確保子資料夾正常抓取)
      await Promise.all([
          loadComponent('component-header', '/components/header.html'),
          loadComponent('component-sidebar', '/components/sidebar.html'),
          loadComponent('component-footer', '/components/footer.html')
      ]);
      
      // 渲染 Lucide Icons (包含 Header, Sidebar 內部圖示，以及 Tool 內部圖示)
      if (typeof lucide !== 'undefined') lucide.createIcons();
      
      // 啟動系統級防禦網與高光偵測
      setupEventDelegation();
      setupSidebarActiveState();
    }

    // 啟動系統框架
    document.addEventListener('DOMContentLoaded', initializeSystem);
  </script>

  <!-- ========================================== -->
  <!-- 工具級業務邏輯：圖片影像格式轉換專用            -->
  <!-- ========================================== -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // DOM 節點
      const dropZone = document.getElementById('drop-zone');
      const previewZone = document.getElementById('preview-zone');
      const fileInput = document.getElementById('file-input');
      const previewImg = document.getElementById('preview-img');
      const resetBtn = document.getElementById('reset-btn');
      const formatSelect = document.getElementById('format-select');
      const qualityContainer = document.getElementById('quality-container');
      const convertBtn = document.getElementById('convert-btn');
      const convertBtnText = document.getElementById('convert-btn-text');
      const btnIconCpu = document.getElementById('btn-icon-cpu');
      const btnIconSpin = document.getElementById('btn-icon-spin');
      const downloadContainer = document.getElementById('download-container');
      const errorMsgBox = document.getElementById('error-msg');
      const canvas = document.getElementById('conversion-canvas');

      let currentFile = null;
      let objectUrl = null;

      // --- 按鈕狀態機 ---
      function setBtnState(state) {
        if (state === 'disabled') {
          convertBtn.disabled = true;
          convertBtn.className = "w-full py-3.5 rounded-xl font-medium flex items-center justify-center gap-2 transition-all bg-slate-800 text-slate-500 cursor-not-allowed select-none";
          convertBtnText.textContent = "等待來源輸入";
          btnIconCpu.classList.remove('hidden');
          btnIconSpin.classList.add('hidden');
        } else if (state === 'ready') {
          convertBtn.disabled = false;
          convertBtn.className = "w-full py-3.5 rounded-xl font-medium flex items-center justify-center gap-2 transition-all bg-gradient-to-r from-[#2cb8f3] to-blue-600 hover:from-[#1da7e0] hover:to-blue-500 text-white shadow-lg shadow-[#2cb8f3]/25 cursor-pointer select-none";
          convertBtnText.textContent = "啟動轉換引擎";
          btnIconCpu.classList.remove('hidden');
          btnIconSpin.classList.add('hidden');
        } else if (state === 'processing') {
          convertBtn.disabled = true;
          convertBtn.className = "w-full py-3.5 rounded-xl font-medium flex items-center justify-center gap-2 transition-all bg-slate-800 text-[#2cb8f3] border border-slate-700 cursor-wait select-none";
          convertBtnText.textContent = "引擎運算中...";
          btnIconCpu.classList.add('hidden');
          btnIconSpin.classList.remove('hidden');
        }
      }

      function resetUI() {
        downloadContainer.classList.add('hidden');
        errorMsgBox.classList.add('hidden');
        convertBtn.classList.remove('hidden');
        setBtnState(currentFile ? 'ready' : 'disabled');
      }

      // --- 檔案處理 ---
      function handleFile(file) {
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          document.getElementById('error-text').textContent = '請上傳有效的圖片檔案格式。';
          errorMsgBox.classList.remove('hidden');
          return;
        }
        currentFile = file;
        document.getElementById('file-name').textContent = file.name;
        document.getElementById('file-size').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
        
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(file);
        previewImg.src = objectUrl;

        dropZone.classList.add('hidden');
        previewZone.classList.remove('hidden');
        resetBtn.classList.remove('hidden');
        
        const format = formatSelect.value;
        qualityContainer.classList.toggle('hidden', !(format === 'image/jpeg' || format === 'image/webp'));
        resetUI();
      }

      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
      
      // 拖曳處理
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-[#2cb8f3]'); });
      dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.classList.remove('border-[#2cb8f3]'); });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.classList.remove('border-[#2cb8f3]');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      resetBtn.addEventListener('click', () => {
        currentFile = null;
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        fileInput.value = ''; previewImg.src = '';
        dropZone.classList.remove('hidden');
        previewZone.classList.add('hidden');
        resetBtn.classList.add('hidden');
        resetUI();
      });

      formatSelect.addEventListener('change', () => {
        const format = formatSelect.value;
        qualityContainer.classList.toggle('hidden', !(format === 'image/jpeg' || format === 'image/webp'));
        resetUI();
      });
      
      document.getElementById('quality-slider').addEventListener('input', (e) => {
        document.getElementById('quality-display').textContent = Math.round(e.target.value * 100) + '%';
        resetUI();
      });

      // --- 核心轉換邏輯 ---
      convertBtn.addEventListener('click', () => {
        if (!currentFile || !objectUrl) return;

        setBtnState('processing');
        errorMsgBox.classList.add('hidden');

        setTimeout(() => {
          const img = new Image();
          
          img.onload = () => {
            try {
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              const targetFormat = formatSelect.value;
              const quality = parseFloat(document.getElementById('quality-slider').value);

              canvas.width = img.width;
              canvas.height = img.height;

              // 如果目標是不支援透明度的格式，預先填入白色背景，防止變黑
              if (targetFormat === 'image/jpeg' || targetFormat === 'image/bmp') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
              }

              ctx.drawImage(img, 0, 0);

              // 輸出 Data URL
              const dataUrl = canvas.toDataURL(targetFormat, quality);
              
              const originalName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || 'image';
              const targetExt = formatSelect.options[formatSelect.selectedIndex].getAttribute('data-ext');
              
              const downloadLink = document.getElementById('download-link');
              downloadLink.href = dataUrl;
              downloadLink.download = `${originalName}_converted${targetExt}`;

              // 隱藏轉換按鈕，顯示下載區塊
              convertBtn.classList.add('hidden');
              downloadContainer.classList.remove('hidden');

            } catch (err) {
              console.error("Canvas 轉換錯誤:", err);
              document.getElementById('error-text').textContent = '圖片尺寸過大或設備記憶體不足，請嘗試較小的圖片。';
              errorMsgBox.classList.remove('hidden');
              setBtnState('ready');
            }
          };

          img.onerror = () => {
            document.getElementById('error-text').textContent = '瀏覽器無法解析此圖片資料。';
            errorMsgBox.classList.remove('hidden');
            setBtnState('ready');
          };

          img.src = objectUrl;
        }, 50); 
      });
    });
  </script>
</body>
</html>

<!-- 
  ToolHub Header Component (App Shell)
  負責：全域導航、觸發 Sidebar 事件。不包含任何 Sidebar 的 DOM 實體。
-->
<header class="bg-[#0b1120] border-b border-[#1e293b] w-full z-50 sticky top-0">
<div class="max-w-7xl mx-auto px-2 min-[360px]:px-3 sm:px-4 lg:px-8">
<div class="flex justify-between items-center gap-2 h-16">
<!-- 左側：品牌標識 (Logo) -->
<div class="flex-shrink-0 flex items-center">
<a class="flex items-center gap-2 group cursor-pointer text-decoration-none" href="/ja/">
<!-- 六角形 SVG Icon -->
<svg class="w-6 h-6 sm:w-7 sm:h-7 text-[#3ebcf0] group-hover:scale-105 transition-transform duration-300" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
</svg>
<!-- 品牌文字 -->
<span class="text-lg min-[360px]:text-xl sm:text-2xl font-bold tracking-wide flex items-center mt-0.5 font-sans">
<span class="text-white">ツール</span><span class="text-[#3ebcf0]">ハブ</span>
</span>
</a>
</div>
<!-- 右側：首頁與開關 (Core Actions) -->
<div class="flex flex-shrink-0 items-center gap-0 sm:gap-1 lg:gap-3">
<!-- 首頁按鈕 -->
<a aria-label="ホーム" class="group hidden sm:flex items-center gap-1.5 text-slate-300 hover:text-white transition-colors duration-200 text-sm font-medium px-2 py-1.5 rounded-md hover:bg-slate-800/50" href="/ja/">
<svg class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-slate-400 group-hover:text-white transition-colors duration-200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
<polyline points="9 22 9 12 15 12 15 22"></polyline>
</svg>
<span class="hidden xl:block">ホーム</span>
</a>
<!-- 全站工具搜尋 -->
<button aria-controls="tool-search-overlay" aria-expanded="false" aria-haspopup="dialog" aria-label="サイト全体からツールを検索" class="group inline-flex items-center gap-1.5 text-slate-300 hover:text-white transition-colors duration-200 text-sm font-medium px-2 py-1.5 rounded-md hover:bg-slate-800/50" id="tool-search-trigger" title="site 全体の tool を検索します（Ctrl または Command + K）。" type="button">
<svg aria-hidden="true" class="w-[18px] h-[18px] flex-none text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span class="hidden xl:block">ツールを検索</span>
<kbd class="hidden 2xl:inline-flex">Ctrl K</kbd>
</button>
<!-- 語言切換 -->
<button aria-label="言語を選択" class="group inline-flex items-center gap-1.5 text-slate-300 hover:text-white transition-colors duration-200 text-sm font-medium px-2 py-1.5 rounded-md hover:bg-slate-800/50" data-language-switch="" title="言語を選択" type="button">
<svg aria-hidden="true" class="w-[18px] h-[18px] flex-none text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>
<span class="hidden xl:block" data-language-switch-label="">言語</span>
</button>
<!-- 全站主題顏色選擇器 -->
<button aria-controls="theme-menu" aria-expanded="false" aria-label="テーマカラーを変更" class="group inline-flex items-center gap-1.5 text-slate-300 hover:text-white transition-colors duration-200 text-sm font-medium px-2 py-1.5 rounded-md hover:bg-slate-800/50" id="theme-trigger-btn" title="テーマカラーを変更" type="button">
<svg class="w-5 h-5 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="13.5" cy="6.5" fill="currentColor" r=".5"></circle><circle cx="17.5" cy="10.5" fill="currentColor" r=".5"></circle><circle cx="8.5" cy="7.5" fill="currentColor" r=".5"></circle><circle cx="6.5" cy="12.5" fill="currentColor" r=".5"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.6-.7 1.6-1.7 0-.9-.8-1.4-.8-2.2 0-.9.7-1.7 1.7-1.7h2c3 0 5.5-2.5 5.5-5.5C22 6 17.5 2 12 2z"></path></svg>
<span class="hidden xl:block">テーマ</span>
</button>
<div class="theme-menu" hidden="" id="theme-menu">
<div class="theme-menu-title"><span>サイトテーマを選択</span><span class="font-normal text-slate-400" id="theme-current-label"></span></div>
<div class="theme-options"></div>
</div>
<!-- 視覺分隔線 -->
<div class="hidden xl:block h-5 w-px bg-slate-700/50 mx-1"></div>
<!-- Sidebar 漢堡選單觸發器 -->
<button aria-label="サイドバーを開閉" class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-white hover:bg-slate-800/80 focus:outline-none focus:ring-2 focus:ring-[#3ebcf0]/50 transition-all duration-200" id="sidebar-trigger-btn" type="button">
<svg class="block h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</div>
</header>
<!-- 全站工具搜尋面板 -->
<div class="tool-search-overlay" hidden="" id="tool-search-overlay">
<section aria-labelledby="tool-search-title" aria-modal="true" class="tool-search-dialog" id="tool-search-dialog" role="dialog">
<header class="tool-search-heading">
<div>
<span class="tool-search-kicker">ツール検索</span>
<h2 id="tool-search-title">ToolHubのツールを検索</h2>
</div>
<button aria-label="検索を閉じる" id="tool-search-close" type="button"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</header>
<label class="tool-search-field" for="tool-search-input">
<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input aria-autocomplete="list" aria-controls="tool-search-results" autocomplete="off" id="tool-search-input" inputmode="search" placeholder="ツール名、カテゴリ、URLで検索…" spellcheck="false" type="search"/>
<kbd>ESC</kbd>
</label>
<div class="tool-search-meta"><span aria-live="polite" id="tool-search-status" role="status">ツール一覧を作成しています…</span><span>↑ ↓ 選択 · Enter で開く</span></div>
<div aria-label="ツール検索結果" class="tool-search-results" id="tool-search-results" role="listbox"></div>
<footer><span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>検索はブラウザ内だけで実行されます</span><span id="tool-search-total">ツール一覧を読み込んでいます</span></footer>
</section>
</div>
<!-- 通訊邏輯：只負責「廣播」，不負責操作 DOM -->
<script>
  (function initHeaderEvent() {
    const triggerBtn = document.getElementById('sidebar-trigger-btn');
    
    if (triggerBtn) {
      // 防止 SPA 重複綁定的防禦性克隆
      const newBtn = triggerBtn.cloneNode(true);
      triggerBtn.parentNode.replaceChild(newBtn, triggerBtn);
      
      newBtn.addEventListener('click', () => {
        // 發送全域事件，通知 Sidebar 開啟或關閉
        // 事件名稱：'toggle-toolhub-sidebar'
        window.dispatchEvent(new CustomEvent('toggle-toolhub-sidebar'));
      });
    }
  })();
</script>
<script src="/components/theme.js?v=20260824-1"></script>
<script src="/components/tool-search.js?v=20260913-1"></script>
<script src="/components/language.js?v=20260913-2"></script>

<!-- 
  ToolHub Header Component (App Shell)
  負責：全域導航、觸發 Sidebar 事件。不包含任何 Sidebar 的 DOM 實體。
-->
<header class="bg-[#0b1120] border-b border-[#1e293b] w-full z-50 sticky top-0">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <!-- 左側：品牌標識 (Logo) -->
      <div class="flex-shrink-0 flex items-center">
        <a href="/" class="flex items-center gap-2 group cursor-pointer text-decoration-none">
          <!-- 六角形 SVG Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" 
               class="w-6 h-6 sm:w-7 sm:h-7 text-[#3ebcf0] group-hover:scale-105 transition-transform duration-300" 
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" 
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          </svg>
          <!-- 品牌文字 -->
          <span class="text-xl sm:text-2xl font-bold tracking-wide flex items-center mt-0.5 font-sans">
            <span class="text-white">Tool</span><span class="text-[#3ebcf0]">Hub</span>
          </span>
        </a>
      </div>

      <!-- 右側：首頁與開關 (Core Actions) -->
      <div class="flex items-center gap-1 sm:gap-3">
        
        <!-- 首頁按鈕 -->
        <a href="/" class="group flex items-center gap-1.5 text-slate-300 hover:text-white transition-colors duration-200 text-sm font-medium px-2 py-1.5 rounded-md hover:bg-slate-800/50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 sm:w-4.5 sm:h-4.5 text-slate-400 group-hover:text-white transition-colors duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span class="hidden sm:block">首頁</span>
        </a>

        <!-- 視覺分隔線 -->
        <div class="hidden sm:block h-5 w-px bg-slate-700/50 mx-1"></div>

        <!-- Sidebar 漢堡選單觸發器 -->
        <button id="sidebar-trigger-btn" type="button" 
                class="inline-flex items-center justify-center p-2 rounded-md text-slate-400 hover:text-white hover:bg-slate-800/80 focus:outline-none focus:ring-2 focus:ring-[#3ebcf0]/50 transition-all duration-200" 
                aria-label="開啟或關閉側邊欄">
          <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
      
    </div>
  </div>
</header>

<!-- 通訊邏輯：只負責「廣播」，不負責操作 DOM -->
<script>
  (function initHeaderEvent() {
    const triggerBtn = document.getElementById('sidebar-trigger-btn');
    
    if (triggerBtn) {
      // 防止 SPA 重複綁定的防禦性克隆
      const newBtn = triggerBtn.cloneNode(true);
      triggerBtn.parentNode.replaceChild(newBtn, triggerBtn);
      
      newBtn.addEventListener('click', () => {
        // 發送全域事件，通知 Sidebar 開啟或關閉
        // 事件名稱：'toggle-toolhub-sidebar'
        window.dispatchEvent(new CustomEvent('toggle-toolhub-sidebar'));
      });
    }
  })();
</script>

<!-- 
  ToolHub Footer Component
  設計理念：底層支撐、預留商業化能量輸入埠、維持視覺穩定性。
  依賴：Tailwind CSS
-->
<footer class="bg-[#0b1120] border-t border-[#1e293b] w-full mt-auto relative z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
    
    <!-- 戰略資源保留區 (Future Monetization / Ad Block) -->
    <!-- 日後可將此 div 內部的 span 替換為廣告 Script -->
    <div id="hub-monetization-slot" class="w-full max-w-3xl mx-auto mb-8 min-h-[90px] rounded-lg border border-dashed border-slate-700/30 flex items-center justify-center bg-slate-800/10 transition-colors hover:border-slate-600/50">
      <span class="text-xs text-slate-600 font-mono tracking-widest uppercase select-none opacity-50">
        Strategic Resource Allocation Slot
      </span>
    </div>

    <!-- 系統宣告與版權 (Copyright & System Architecture Declaration) -->
    <div class="flex flex-col items-center justify-center text-center space-y-2">
      <!-- 品牌圖騰微縮版 -->
      <svg xmlns="http://www.w3.org/2000/svg" 
           class="w-5 h-5 text-slate-600 mb-1" 
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" 
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
      </svg>
      
      <p class="text-slate-400 text-sm font-medium tracking-wide">
        &copy; 2026 ToolHub Engine <span class="text-slate-600 mx-2">|</span> <span class="text-slate-500 font-sans">Architecture & Logic Optimized.</span>
      </p>
    </div>
    
  </div>
</footer>
